# Fabrique l'appli Android (APK) de GameCheck à partir du site, puis la publie dans "Releases".
# Lancer : onglet Actions > "Appli Android" > Run workflow (en changeant la version si besoin).
name: Appli Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.0.1)"
        required: true
        default: "1.0.0"
      code:
        description: "Numéro de version (entier qui augmente à chaque fois)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Clé de signature
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "NEW_KEY=false" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore android.keystore -alias gamecheck -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=KOSHMAR TRAK, OU=App, O=GameCheck, C=FR"
            echo "NEW_KEY=true" >> $GITHUB_ENV
          fi
          keytool -list -v -keystore android.keystore -alias gamecheck -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' > sha256.txt
          echo "Empreinte : $(cat sha256.txt)"

      - name: Version
        working-directory: android
        run: |
          jq --arg v "${{ inputs.version }}" --argjson c ${{ inputs.code }} '.appVersionName=$v | .appVersion=$v | .appVersionCode=$c' twa-manifest.json > t.json && mv t.json twa-manifest.json

      - name: Générer le projet Android
        working-directory: android
        run: yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Construire l'APK
        working-directory: android
        run: yes | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - name: Préparer les fichiers
        working-directory: android
        run: |
          mkdir -p out
          cp app-release-signed.apk out/GameCheck.apk
          cp sha256.txt out/empreinte-sha256.txt

      - name: Garder la nouvelle clé (premier lancement seulement)
        if: env.NEW_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cle-signature
          path: android/android.keystore
          retention-days: 1

      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" android/out/GameCheck.apk android/out/empreinte-sha256.txt \
            --title "GameCheck ${{ inputs.version }} (Android)" \
            --notes "Appli Android de GameCheck. Télécharge GameCheck.apk sur ton téléphone puis ouvre-le pour l'installer (accepte l'installation depuis cette source)." \
            || gh release upload "v${{ inputs.version }}" android/out/GameCheck.apk android/out/empreinte-sha256.txt --clobber
